name: Build and push Transito Server Docker image to Google Cloud Platform

on:
    push:
        branches: [main]

jobs:
    verify:
        if: ${{ !contains(github.event.head_commit.message, '--skip-ci') }}
        name: Verify
        runs-on: ubuntu-latest

        permissions:
            contents: "read"

        steps:
            - name: Checkout
              uses: actions/checkout@v7

            # pnpm's version comes from packageManager in package.json.
            - uses: pnpm/action-setup@v6

            - uses: actions/setup-node@v7
              with:
                  node-version: 26
                  cache: pnpm

            - run: pnpm install --frozen-lockfile

            # The Static Catalogue is gitignored but imported by type-check and tests, as in the dockerfile.
            - name: Write placeholder Static Catalogue
              run: |
                  echo '{ "metadata": "", "data": [] }' > src/json/bus-services.json
                  echo '{ "metadata": "", "data": [] }' > src/json/bus-stops.json

            - run: pnpm exec tsc -p tsconfig.app.json --noEmit
            - run: pnpm exec tsc -p tsconfig.test.json
            - run: pnpm test

    deploy:
        needs: verify
        name: Deploy
        runs-on: ubuntu-latest

        permissions:
            contents: "read"
            id-token: "write"

        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - id: auth
              uses: google-github-actions/auth@v3
              with:
                  credentials_json: ${{ secrets.GCE_SA_KEY }}

            - name: Set up Cloud SDK
              uses: google-github-actions/setup-gcloud@v3

            - name: Configure Docker Client
              run: gcloud auth configure-docker us-west1-docker.pkg.dev --quiet

            - name: Create ENV file for Docker Compose
              run: |
                  touch .env
                  echo LTA_API_KEY=${{ secrets.LTA_API_KEY }} >> .env
                  echo SECRET=${{ secrets.JSON_SECRET }} >> .env
                  echo PORT=80 >> .env

            - name: Build image
              run: docker compose build

            # The server must boot from the image before it replaces the one on the VM.
            - name: Smoke-test image
              run: |
                  docker run -d --name smoke -p 8080:80 -e PORT=80 "$(docker compose config --images | head -n 1)"
                  for attempt in $(seq 1 15); do
                      if curl -fsS http://localhost:8080/ | grep -q "Transito's server is running as expected"; then
                          docker rm -f smoke
                          exit 0
                      fi
                      sleep 2
                  done
                  docker logs smoke
                  exit 1

            - name: Push image to Artifact Registry
              run: docker compose push

            - name: Restart Cloud Engine to use new image
              run: |
                  gcloud compute instances reset transito-server --zone=us-west1-b
